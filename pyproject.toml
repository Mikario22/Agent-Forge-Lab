[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-forge-lab"
version = "0.1.0"
description = "Auditable, evidence-grounded multi-agent orchestration with optional LLM roles"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-forge = "agent_forge_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
